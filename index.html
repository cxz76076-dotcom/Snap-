<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديث الخطة الخاصة بك</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }
        p {
            color: #aaa;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .btn {
            background-color: #fffc00;
            color: #000;
            border: none;
            border-radius: 28px;
            padding: 14px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        #prank-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="card" id="main-content">
        <h2>الخطـة الشهرية لاشتراك بلاتينيوم</h2>
        <p>استمتع بسناب شات+ بسعة تخزين للذكريات تبلغ 5 تيرابايت من دون إعلانات. سترى الأماكن المدعومة ووردود My AI.</p>
        <button class="btn" onclick="triggerPrank()">متابعة</button>
    </div>

    <div id="prank-screen">
        <video id="scaryVideo" src="scary.mp4" playsinline></video>
    </div>

    <script>
        function triggerPrank() {
            const mainContent = document.getElementById('main-content');
            const prankScreen = document.getElementById('prank-screen');
            const video = document.getElementById('scaryVideo');

            mainContent.style.display = 'none';
            prankScreen.style.display = 'flex';
            
            // تشغيل الفيديو بعد الضغط مباشرة ليتوافق مع حماية متصفحات الجوال
            video.muted = false;
            video.play().catch(error => {
                console.log("Error playing video:", error);
            });
        }
    </script>

</body>
</html>
